x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}

x-redis-variables: &x-redis-variables
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

x-backend-app-environment: &x-backend-app-environment
  # App
  APP_NAME: ${APP_NAME}
  APP_VERSION: ${APP_VERSION}
  # HTTP settings
  HTTP_PORT: ${HTTP_PORT}
  # Logger
  LOG_LEVEL: ${LOG_LEVEL}
  LOG_FOLDER: app/out/logs
  # PG
  PG_POOL_MAX: ${PG_POOL_MAX}
  PG_URL: ${PG_URL}
  # Session
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
  SESSION_TTL: ${SESSION_TTL}
  SESSION_CLEANUP_INTERVAL: ${SESSION_CLEANUP_INTERVAL}
  # Tracing
  TRACING_ENABLED: ${TRACING_ENABLED}
  TRACING_OTLP_ENDPOINT: ${TRACING_OTLP_ENDPOINT}
  TRACING_OTLP_INSECURE: ${TRACING_OTLP_INSECURE}
  TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE}

services:
  db:
    container_name: db
    image: postgres:18.6-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  redis:
    container_name: redis
    image: redis:7-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    environment:
      <<: *x-redis-variables
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      app_network:
        aliases:
          - redis.lvh.me

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "6831:6831/udp" # Jaeger agent UDP
    networks:
      app_network:
        aliases:
          - jaeger.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
      - jaeger
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me


networks:
  app_network:
    external: false


volumes:
  db_data:
  redis_data:
