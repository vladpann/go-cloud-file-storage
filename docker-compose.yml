x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}

x-backend-app-environment: &x-backend-app-environment
  # App
  APP_NAME: ${APP_NAME}
  APP_VERSION: ${APP_VERSION}
  # HTTP settings
  HTTP_PORT: ${HTTP_PORT}
  # Logger
  LOG_LEVEL: ${LOG_LEVEL}
  # PG
  PG_POOL_MAX: ${PG_POOL_MAX}
  PG_URL: ${PG_URL}

services:
  db:
    container_name: db
    image: postgres:18.6-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me


networks:
  app_network:
    external: false


volumes:
  db_data:
