run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck # Check for unchecked errors
    - gosimple # Simplify code
    - govet # Vet examines Go source code
    - ineffassign # Detect ineffectual assignments
    - staticcheck # Static analysis
    - unused # Find unused code
    - gofmt # Check code formatting
    - goimports # Check import formatting
    - misspell # Spell checking
    - gosec # Security checks
    - revive # Golint replacement
    - unconvert # Remove unnecessary type conversions
    - unparam # Find unused function parameters
    - gocritic # Comprehensive linter
    - gocyclo # Cyclomatic complexity
    - dupl # Code clone detection
    - goconst # Find repeated strings that could be constants
    - bodyclose # Check HTTP response body is closed
    - noctx # Check for sending http request without context
    - prealloc # Find slice declarations that could be preallocated

  disable:
    - typecheck # Often has issues with generics

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true

  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow

  gocyclo:
    min-complexity: 15

  dupl:
    threshold: 100

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  lll:
    line-length: 140

  goimports:
    local-prefixes: github.com/vladpann/go-cloud-file-storage

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - whyNoLint
      - commentedOutCode

  revive:
    rules:
      - name: var-naming
        severity: warning
        disabled: false
        arguments:
          - ['ID', 'URL', 'HTTP', 'API', 'UUID', 'SQL', 'DB', 'PG', 'TTL']
      - name: package-comments
        severity: warning
        disabled: true

  gosec:
    excludes:
      - G104 # Audit errors not checked (we use errcheck for this)
      - G304 # File path provided as taint input (often false positives)

issues:
  uniq-by-line: true
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - goconst

    # Exclude some linters from running on migrations
    - path: migrations/
      linters:
        - gosec
        - goconst

    # Exclude lll issues for long lines with go:generate
    - linters:
        - lll
      source: '^//go:generate '
    # Allow underscores in package names for core packages
    - path: internal/core/
      text: "don't use an underscore in package name"
      linters:
        - revive
    # Allow underscores in feature package names
    - path: internal/features/
      text: "don't use an underscore in package name"
      linters:
        - revive

  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
