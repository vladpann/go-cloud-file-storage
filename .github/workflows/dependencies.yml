name: Dependencies Update

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  GO_VERSION: '1.26'

jobs:
  update-dependencies:
    name: Check and Update Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Update dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Check for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "Vulnerabilities found"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update Go dependencies'
          title: 'chore: Update Go dependencies'
          body: |
            ## Dependencies Update

            This PR updates Go dependencies to their latest versions.

            ### Changes
            - Updated all Go modules
            - Ran `go mod tidy`

            ### Security
            - Ran `govulncheck` to scan for vulnerabilities

            Please review the changes and run tests before merging.
          branch: dependencies-update
          delete-branch: true
          labels: dependencies, automated
