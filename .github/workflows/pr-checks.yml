name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  GO_VERSION: '1.26'

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: Check commit messages
        run: |
          git log --format=%s origin/${{ github.base_ref }}..HEAD | while read msg; do
            if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'; then
              echo "Invalid commit message: $msg"
              echo "Commit messages should follow conventional commits format"
              exit 1
            fi
          done

      - name: Check for large files
        run: |
          if git diff --name-only origin/${{ github.base_ref }} | xargs du -sb | awk '$1 > 5242880 {print; exit 1}'; then
            echo "Large files detected (>5MB). Please use Git LFS or remove them."
            exit 1
          fi

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            docker:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.dockerignore'
            docs:
              - '**/*.md'
              - 'docs/**'

  test-go-changes:
    name: Test Go Changes
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests on changed packages
        run: |
          # Get list of changed Go files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} | grep '\.go$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Go files changed"
            exit 0
          fi

          # Extract unique package paths
          PACKAGES=$(echo "$CHANGED_FILES" | xargs -I {} dirname {} | sort -u | sed 's|^|./|')

          echo "Testing packages: $PACKAGES"
          go test -v -race -coverprofile=coverage.out $PACKAGES

  test-docker-changes:
    name: Test Docker Changes
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm test:latest --version || true

  pr-size:
    name: Check PR Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          LINES_CHANGED=$(git diff --shortstat origin/${{ github.base_ref }} | awk '{print $4+$6}')
          echo "Lines changed: $LINES_CHANGED"

          if [ "$LINES_CHANGED" -gt 1000 ]; then
            echo "::warning::This PR is quite large ($LINES_CHANGED lines). Consider splitting it into smaller PRs."
          fi

      - name: Comment PR size
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            let size = 'small';
            let emoji = '🟢';

            if (total > 1000) {
              size = 'large';
              emoji = '🔴';
            } else if (total > 500) {
              size = 'medium';
              emoji = '🟡';
            }

            const body = `
            ${emoji} **PR Size: ${size}**

            - Additions: +${additions}
            - Deletions: -${deletions}
            - Total: ${total} lines

            ${total > 1000 ? '⚠️ This PR is quite large. Consider splitting it into smaller, focused PRs for easier review.' : ''}
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
